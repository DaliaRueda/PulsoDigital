<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Noticias — Pulso Digital</title>
  <meta name="description" content="Archivo completo de noticias de tecnología e innovación, con búsqueda y filtros por categoría.">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="assets/css/styles.css" rel="stylesheet">
</head>

<body>
  <a class="pd-saltar" href="#contenido">Saltar al contenido</a>

  <header id="pd-cabecera"></header>

  <main id="contenido">

    <!-- ===== Encabezado de sección ===== -->
    <section class="pt-5">
      <div class="container">
        <span class="pd-kicker">Archivo completo</span>
        <div class="d-flex align-items-end justify-content-between flex-wrap gap-2 mt-2">
          <h1>Todas las noticias</h1>
          <p class="pd-meta mb-0" style="font-size:0.875rem" id="pd-contador" aria-live="polite"></p>
        </div>
        <hr class="pd-regla mt-4">
      </div>
    </section>

    <!-- ===== Búsqueda y orden ===== -->
    <section class="pt-4">
      <div class="container">
        <div class="row g-3">
          <div class="col-12 col-lg-8">
            <div class="pd-busqueda">
              <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/></svg>
              <label class="visually-hidden" for="pd-buscar">Buscar por título o contenido</label>
              <input type="search" id="pd-buscar" placeholder="Buscar por título o contenido…" autocomplete="off">
            </div>
          </div>
          <div class="col-12 col-lg-4">
            <label class="visually-hidden" for="pd-orden">Ordenar las noticias</label>
            <select class="form-select pd-orden w-100" id="pd-orden">
              <option value="recientes">Ordenar: más recientes</option>
              <option value="antiguas">Ordenar: más antiguas</option>
              <option value="alfabetico">Ordenar: A–Z</option>
            </select>
          </div>
        </div>

        <!-- Chips de categoría: los genera noticias.js -->
        <div class="pd-filtros mt-3" id="pd-filtros" role="group" aria-label="Filtrar por categoría"></div>
      </div>
    </section>

    <!-- ===== Grilla de noticias ===== -->
    <section class="pt-4 pb-5">
      <div class="container">
        <div class="row g-4" id="pd-grid" aria-busy="true"></div>
        <nav class="pd-paginacion mt-5" id="pd-paginacion" aria-label="Paginación del archivo"></nav>
      </div>
    </section>

  </main>

  <footer class="pd-footer" id="pd-pie"></footer>

  <script src="assets/data/noticias-respaldo.js"></script>
  <script src="assets/js/storage.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/ui.js"></script>
  <script src="assets/js/noticias.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
